<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Math Calculator - Musharraf Saifi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .calculator {
      width: 350px;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      color: #222;
      font-size: 28px;
    }

    #display {
      width: 100%;
      height: 65px;
      font-size: 28px;
      text-align: right;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #f8f8f8;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 60px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #e9edf2;
      transition: 0.2s;
    }

    button:hover {
      background: #dce2e8;
      transform: scale(1.03);
    }

    .operator {
      background: #dbeafe;
      color: #1d4ed8;
      font-weight: bold;
    }

    .equal {
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    .equal:hover {
      background: #1d4ed8;
    }

    .clear {
      background: #fee2e2;
      color: #dc2626;
      font-weight: bold;
    }

    .history {
      margin-top: 20px;
      border-top: 1px solid #ddd;
      padding-top: 15px;
    }

    .history h3 {
      margin: 0 0 8px;
      color: #333;
    }

    #historyList {
      font-size: 14px;
      color: #555;
      max-height: 120px;
      overflow-y: auto;
    }

    #historyList div {
      padding: 5px 0;
      border-bottom: 1px solid #eee;
    }

    .designer {
      text-align: center;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      font-size: 14px;
      color: #777;
    }

    .designer strong {
      color: #2563eb;
    }

    @media (max-width: 400px) {
      .calculator {
        width: 92%;
        padding: 18px;
      }

      button {
        height: 55px;
      }
    }
  </style>
</head>

<body>

  <div class="calculator">

    <h1>Math Calculator</h1>

    <input
      type="text"
      id="display"
      readonly
      placeholder="0"
    >

    <div class="buttons">

      <!-- First Row -->
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="deleteLast()">⌫</button>
      <button onclick="addToDisplay('(')">(</button>
      <button onclick="addToDisplay(')')">)</button>

      <!-- Second Row -->
      <button onclick="addToDisplay('7')">7</button>
      <button onclick="addToDisplay('8')">8</button>
      <button onclick="addToDisplay('9')">9</button>
      <button class="operator" onclick="addToDisplay('/')">÷</button>

      <!-- Third Row -->
      <button onclick="addToDisplay('4')">4</button>
      <button onclick="addToDisplay('5')">5</button>
      <button onclick="addToDisplay('6')">6</button>
      <button class="operator" onclick="addToDisplay('*')">×</button>

      <!-- Fourth Row -->
      <button onclick="addToDisplay('1')">1</button>
      <button onclick="addToDisplay('2')">2</button>
      <button onclick="addToDisplay('3')">3</button>
      <button class="operator" onclick="addToDisplay('-')">−</button>

      <!-- Fifth Row -->
      <button onclick="addToDisplay('0')">0</button>
      <button onclick="addToDisplay('.')">.</button>
      <button onclick="percentage()">%</button>
      <button class="operator" onclick="addToDisplay('+')">+</button>

      <!-- Equal -->
      <button
        class="equal"
        style="grid-column: span 4;"
        onclick="calculate()"
      >
        =
      </button>

    </div>

    <!-- History -->
    <div class="history">
      <h3>History</h3>
      <div id="historyList"></div>
    </div>

    <!-- Designer -->
    <div class="designer">
      Designed by <strong>Musharraf Saifi</strong>
    </div>

  </div>


  <script>

    const display = document.getElementById("display");
    const historyList = document.getElementById("historyList");


    // Add value to display
    function addToDisplay(value) {
      display.value += value;
    }


    // Clear display
    function clearDisplay() {
      display.value = "";
    }


    // Delete last character
    function deleteLast() {
      display.value = display.value.slice(0, -1);
    }


    // Percentage
    function percentage() {

      if (display.value !== "") {

        display.value =
          "(" + display.value + ")/100";

      }

    }


    // Calculate result
    function calculate() {

      try {

        const expression = display.value;

        if (!expression) {
          return;
        }


        // Allow only numbers and mathematical operators
        if (!/^[0-9+\-*/().\s]+$/.test(expression)) {

          display.value = "Invalid";

          return;
        }


        const result = Function(
          '"use strict"; return (' + expression + ')'
        )();


        if (!Number.isFinite(result)) {

          display.value = "Error";

          return;
        }


        display.value = result;

        addHistory(expression, result);

      }

      catch (error) {

        display.value = "Error";

      }

    }


    // Add calculation to history
    function addHistory(expression, result) {

      const item = document.createElement("div");

      item.textContent =
        expression + " = " + result;

      historyList.prepend(item);

    }


    // Keyboard support
    document.addEventListener("keydown", function(event) {

      const allowedKeys =
        "0123456789+-*/().";

      if (allowedKeys.includes(event.key)) {

        addToDisplay(event.key);

      }


      // Enter = Calculate
      if (event.key === "Enter") {

        calculate();

      }


      // Backspace = Delete
      if (event.key === "Backspace") {

        deleteLast();

      }


      // Escape = Clear
      if (event.key === "Escape") {

        clearDisplay();

      }

    });

  </script>

</body>
</html>
